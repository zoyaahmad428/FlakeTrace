name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Member 3's evaluation layer: statistics, outcome decision, schema, baseline, yield report.
  python-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install dependencies
        run: pip install -r eval/requirements.txt
      - name: Unit tests (every eval/tests/test_*.py)
        run: |
          modules=$(ls eval/tests/test_*.py | sed 's#/#.#g; s#\.py$##')
          python -m unittest -v $modules
      - name: Yield report runs on the real manifest
        run: python eval/benchmark/yield_report.py

  # The seeded fixture project. Checks the premises the ground truth depends on, so a change
  # to the fixture that silently breaks a case is caught before anything is measured on it.
  fixture-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/od-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Compile fixture
        run: mvn -B -q test-compile
      - name: Victims pass alone (F1, F2, F3)
        run: |
          for t in ConfigVictimTest FeatureVictimTest ToggleVictimTest; do
            mvn -B -q -Dtest=odfixture.$t test
          done
      - name: F1 and F2 victims fail after their polluter
        run: |
          for pair in "ConfigPolluterTest,ConfigVictimTest" "FeaturePolluterTest,FeatureVictimTest"; do
            p=${pair%,*}; v=${pair#*,}
            if mvn -B -q -Dtest="odfixture.$p,odfixture.$v" test; then
              echo "::error::$v passed after $p — fixture no longer order-dependent"; exit 1
            fi
          done
      - name: N1 negative control fails alone
        run: |
          if mvn -B -q -Dtest=odfixture.NegativeAloneFailTest test; then
            echo "::error::NegativeAloneFailTest passed alone — negative control broken"; exit 1
          fi

  # Member 2's order runner: unit tests plus real single-JVM runs on fixture F1.
  # FLAKETRACE_REQUIRE_JVM turns "java/mvn missing" into a failure, so CI can never skip them.
  runner:
    runs-on: ubuntu-latest
    env:
      FLAKETRACE_REQUIRE_JVM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Runner tests (every runner/tests/test_*.py)
        run: |
          modules=$(ls runner/tests/test_*.py | sed 's#/#.#g; s#\.py$##')
          python -m unittest -v $modules

  # Member 1's evidence extractor (evidence/tests/) gets its own job here once agreed with Member 1.
