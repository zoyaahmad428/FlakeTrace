name: Report

# Builds the FYP-1 Mid Report on every PR that touches it, and uploads the PDF.
# Owner: Member 2 (.github/). Separate from ci.yml so a LaTeX problem never blocks code PRs.

on:
  pull_request:
    branches: [main]
    paths: ["mid-eval-report/**", ".github/workflows/report.yml"]
  push:
    branches: [main]
    paths: ["mid-eval-report/**", ".github/workflows/report.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the mid-eval-v1 tag is needed below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Mid report's tables must equal what the reports said AT THE MID (tag mid-eval-v1).
      # eval/reports/ has moved on to schema v2 (W19); the Mid report is a closed record.
      - name: Generated tables match the reports at mid-eval-v1
        run: |
          mkdir -p "$RUNNER_TEMP/mid"
          git archive mid-eval-v1 eval/reports | tar -x -C "$RUNNER_TEMP/mid"
          python mid-eval-report/scripts/json_to_tex.py --reports "$RUNNER_TEMP/mid/eval/reports"
          git diff --exit-code -- mid-eval-report/tables/generated \
            || { echo "::error::The Mid report's tables no longer match the reports at mid-eval-v1"; exit 1; }

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: mid-eval-report
          root_file: main.tex

      - name: Count unfinished TODOs (informational until the freeze)
        run: |
          n=$(grep -rn '\\todo{' mid-eval-report/chapters | wc -l)
          echo "Unfinished \\todo{} markers: $n"
          echo "### Report: $n unfinished \\todo{} markers" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mid-eval-report-pdf
          path: mid-eval-report/main.pdf
